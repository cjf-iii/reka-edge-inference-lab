name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --group dev --group notebook
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit and integration tests
        run: uv run python -m unittest discover -s tests -v
      - name: Execute reviewer notebook
        run: uv run --group notebook jupyter nbconvert --to notebook --execute notebooks/01_workload_to_decision.ipynb --stdout > /dev/null
      - name: Offline evidence smoke test
        run: |
          uv run reka-infer demo --output artifacts/demo
          uv run reka-infer verify artifacts/demo
